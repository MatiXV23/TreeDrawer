<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">TreeDrawer — Entendé los árboles, paso a paso.</title>
  <desc id="desc">Aplicación didáctica de Matias Perez para dibujar árboles, implementar funciones y visualizar su ejecución. Ilustración de un árbol binario de búsqueda balanceado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171c32"/><stop offset="1" stop-color="#11151e"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8b95ff" fill-opacity=".13"/>
    </pattern>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect x="680" y="24" width="576" height="392" rx="20" fill="url(#dots)"/>
  <g transform="translate(56 48)">
